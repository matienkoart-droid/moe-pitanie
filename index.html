:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}[hidden]{display:none!important}

<style>
/* Layout: mobile app shell, one column up to 520px, fixed bottom tab bar, sheets slide up from the bottom */
:root{
  --bg:#F1F4EC; --surface:#FFFFFF; --surface-2:#E6ECDF; --ink:#1A2418; --muted:#66705F; --line:#D9E0D1;
  --leaf:#3D7A36; --leaf-ink:#FFFFFF; --leaf-soft:#DCEBD3; --carrot:#D9702B; --carrot-soft:#F8E3D3; --berry:#B23A5B;
  --shadow:0 1px 2px rgba(26,36,24,.06),0 8px 24px rgba(26,36,24,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121610; --surface:#1B2118; --surface-2:#242C20; --ink:#E9EEE4; --muted:#9AA592; --line:#2E3829;
  --leaf:#7DC46F; --leaf-ink:#0F1A0C; --leaf-soft:#22341D; --carrot:#F0924F; --carrot-soft:#3A2617; --berry:#E2708F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121610; --surface:#1B2118; --surface-2:#242C20; --ink:#E9EEE4; --muted:#9AA592; --line:#2E3829;
  --leaf:#7DC46F; --leaf-ink:#0F1A0C; --leaf-soft:#22341D; --carrot:#F0924F; --carrot-soft:#3A2617; --berry:#E2708F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;background:var(--leaf);color:var(--leaf-ink);font-weight:600;font-size:16px;width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{padding:9px 12px;font-size:14px;width:auto;border-radius:11px}
.btn:disabled{opacity:.45}
.chip{padding:8px 13px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:500;border:1.5px solid transparent}
.chip[aria-pressed="true"]{background:var(--leaf-soft);border-color:var(--leaf);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.plate{flex:none;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--surface) 0 45%,var(--surface-2) 46% 100%);box-shadow:inset 0 0 0 1px var(--line)}
.p44{width:48px;height:48px;font-size:26px}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;padding-block:8px 14px}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;background:var(--surface);font-size:12px;color:var(--muted)}
.day b{font-size:16px;color:var(--ink);font-weight:600}
.day[aria-current="true"]{background:var(--ink);color:var(--bg)}
.day[aria-current="true"] b{color:var(--bg)}

/* summary */
.sum{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:112px;height:112px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-size:20px;font-weight:700}
.ring .c span{font-size:11px;color:var(--muted)}
.macro{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--leaf)}

/* meal row */
.meal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);text-align:left;width:100%}
.meal .t{min-width:0}
.meal .t h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal small{color:var(--muted);font-size:12.5px}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.tick[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.done h3{text-decoration:line-through;text-decoration-color:var(--muted)}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--carrot)}

/* week */
.wday{padding:14px}
.wday .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.wline{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);text-align:left;width:100%;font-size:14px}
.wline span:nth-child(2){min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* recipe grid */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.rcard .plate{width:64px;height:64px;font-size:36px}
.rcard h3{font-size:14px;line-height:1.3}
.search{position:relative}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* shopping */
.sec{margin-top:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);width:100%;text-align:left}
.item:first-of-type{border-top:0}
.irow{display:grid;grid-template-columns:1fr;align-items:center;gap:4px;border-top:1px solid var(--line)}
.irow:first-of-type{border-top:0}
.irow .item{border-top:0}
.find{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.tabs .find svg,.card h3+svg{width:22px;height:22px}
.item .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.item[aria-pressed="true"] .box{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.item[aria-pressed="true"] .nm{text-decoration:line-through;color:var(--muted)}
.qty{color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{padding:9px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);padding:6px 0}
.tabs button[aria-current="true"]{color:var(--leaf)}
.tabs svg{width:24px;height:24px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,9,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.hero{display:flex;gap:14px;align-items:center}
.hero .plate{width:84px;height:84px;font-size:48px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.kp div{background:var(--surface);border-radius:14px;padding:10px 4px}
.kp b{display:block;font-size:17px}
.kp span{font-size:11px;color:var(--muted)}
.ing{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.ing:first-child{border-top:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--surface-2);font-size:20px;font-weight:600}
ol.rsteps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
ol.rsteps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14.5px}
ol.rsteps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center;font-weight:700;font-size:13px}
.alt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface);text-align:left;width:100%}

/* cook mode */
.cook{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.cook .in{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--leaf)}
.cook .body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.cook .big{font-family:var(--f-display);font-size:22px;line-height:1.3;font-weight:500}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--carrot-soft);border-radius:18px;padding:14px 16px}
.timer b{font-family:var(--f-display);font-size:30px;color:var(--carrot)}
.timer.ring b{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* onboarding */
.ob{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto}
.ob .in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.obbar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.obbar i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.obq{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.2}
.swipe{position:relative;height:330px;touch-action:pan-y}
.scard{position:absolute;inset:0;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;user-select:none;-webkit-user-select:none}
.scard .plate{width:150px;height:150px;font-size:86px}
.scard .stamp{position:absolute;top:18px;padding:4px 10px;border-radius:8px;font-weight:700;border:2.5px solid;opacity:0;font-size:15px;letter-spacing:.05em}
.scard .yes{left:18px;color:var(--leaf);transform:rotate(-10deg)}
.scard .no{right:18px;color:var(--berry);transform:rotate(10deg)}
.yn{display:flex;justify-content:center;gap:28px}
.yn button{width:66px;height:66px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.yn .l{background:var(--leaf);color:var(--leaf-ink)}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:16px;background:var(--surface);border:2px solid transparent;width:100%}
.opt[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.opt small{display:block;color:var(--muted);font-size:13px}
.result{font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--leaf)}
.spacer{flex:1}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
textarea.copy{width:100%;min-height:140px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function nut(r,k=1){const o={kcal:0,p:0,f:0,c:0};for(const [id,g] of r.ing){const i=ING[id],m=g*k/100;o.kcal+=i[1]*m;o.p+=i[2]*m;o.f+=i[3]*m;o.c+=i[4]*m}return o}

  const unit=u==='ml'?['мл','л']:['г','кг'];
  if(g>=1000)return fmtNum(Math.ceil(g/100)/10)+' '+unit[1];
  const step=g<50?5:10;return Math.ceil(g/step)*step+' '+unit[0]}

function targets(p){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='f'?-161:5);
  const tdee=bmr*p.activity;
  let k=p.goal==='lose'?tdee*.8:p.goal==='gain'?tdee*1.1:tdee;
  k=Math.round(Math.max(k,p.sex==='f'?1300:1600)/10)*10;
  const prot=Math.round(Math.min(p.weight,p.sex==='f'?90:120)*(p.goal==='gain'?1.8:1.6));
  const fat=Math.round(k*.27/9);
  const carb=Math.max(0,Math.round((k-prot*4-fat*9)/4));
  return {bmr:r0(bmr),tdee:r0(tdee),kcal:k,p:prot,f:fat,c:carb};
}

function weightChart(ws){if(ws.length<2)return'';
  const W=300,H=90,P=8;const xs=ws.map(w=>pd(w.d).getTime()),ys=ws.map(w=>w.w);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)-.5,y1=Math.max(...ys)+.5;
  const X=t=>P+(x1===x0?0:(t-x0)/(x1-x0))*(W-2*P),Y=v=>P+(1-(v-y0)/(y1-y0))*(H-2*P);
  const pts=ws.map((w,i)=>X(xs[i]).toFixed(1)+','+Y(w.w).toFixed(1));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--leaf)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?'var(--leaf)':'var(--surface)'}" stroke="var(--leaf)" stroke-width="2"/>`).join('')}</svg>`}

function vCook(){const r=R[cook.id],s=r.st[cook.i],last=cook.i===r.st.length-1;const min=s[1]||0;
  const left=cook.left==null?min*60:cook.left;

  return `<div class="cook"><div class="in">

function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
  for(let i=0;i<3;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t+i*.4);g.gain.exponentialRampToValueAtTime(.3,t+i*.4+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.4+.3);o.start(t+i*.4);o.stop(t+i*.4+.32)}}catch(e){}}

function swipeAnswer(like){const id=SWIPE_SET[UI.swipeIdx];if(!id)return;const p=S.profile;

function bindSwipe(){const el=document.getElementById('scard');if(!el)return;let x0=null,dx=0;

  const end=()=>{if(x0==null)return;x0=null;el.style.transition='transform .2s';

  case 'like':p.likes=p.likes.includes(sheet.id)?p.likes.filter(x=>x!==sheet.id):[...p.likes,sheet.id];p.dislikes=p.dislikes.filter(x=>x!==sheet.id);save();renderLayer();if(UI.tab==='me'||UI.tab==='book')render();break;
  case 'alt':sheet.alt=!sheet.alt;renderLayer();break;
  case 'swap':{const id=t.dataset.id,k=portion(id,sheet.m);S.plan[sheet.d][sheet.m]={id,k};sheet.id=id;sheet.k=k;sheet.alt=false;save();render();renderLayer();toast('Блюдо заменено');break}
  case 'toplan':{const r=R[sheet.id];S.plan[UI.day]=S.plan[UI.day]||{};S.plan[UI.day][r.cat]={id:r.id,k:portion(r.id,r.cat)};save();sheet=null;renderLayer();UI.tab='today';render();toast(MEAL_NAME[r.cat]+' на '+fmtDay(UI.day).split(',')[0]+' обновлён');break}
  case 'k':{sheet.k=Math.max(.3,Math.min(4,Math.round((sheet.k+Number(v))*10)/10));if(sheet.d){S.plan[sheet.d][sheet.m].k=sheet.k;save();render()}renderLayer();break}
  case 'cook':startCook();break;
  case 'cookx':stopTimer();cook=null;try{wake&&wake.release()}catch(e){}renderLayer();break;
  case 'cookdone':{stopTimer();const id=cook.id;cook=null;try{wake&&wake.release()}catch(e){}renderLayer();toast('Приятного аппетита!');
    const d=today(),day=S.plan[d];if(day&&day[R[id].cat]&&day[R[id].cat].id===id){S.eaten[d]=S.eaten[d]||{};S.eaten[d][R[id].cat]=true;save();render()}break}
  case 'next':resetStep();cook.i++;renderLayer();break;
  case 'prev':resetStep();cook.i--;renderLayer();break;
  case 'treset':resetStep();renderLayer();break;
  case 'ttoggle':{
    if(cook.ring){cook.ring=false;cook.left=null;stopTimer();renderLayer();break}
    try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
    if(cook.run){stopTimer();renderLayer();break}
    if(cook.left==null)cook.left=stepMin()*60;cook.run=true;
    tick=setInterval(()=>{if(!cook){clearInterval(tick);return}cook.left--;if(cook.left<=0){cook.left=0;stopTimer();cook.ring=true;beep();setTimeout(beep,1500)}renderLayer()},1000);
    renderLayer();break}
  case 'obnext':if(UI.ob<OB_STEPS-1){UI.ob++;renderOb()}else{S.onboarded=true;if(!S.weights.length)S.weights.push({d:today(),w:p.weight});rebuildPlan();save();layer.innerHTML='';UI.tab='today';render()}break;
  case 'obback':UI.ob=Math.max(0,UI.ob-1);if(UI.ob===1)UI.swipeIdx=0;renderOb();break;
  case 'sw':swipeAnswer(Number(v));break;
  case 'swskip':swipeAnswer(-1);break;
  case 'sex':p.sex=v;save();renderOb();break;
  case 'act':p.activity=Number(v);save();renderOb();break;
  case 'goal':p.goal=v;save();renderOb();break;
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.a==='badq'){UI.badQ=t.value;document.getElementById('badlist').innerHTML=badChips()}
  if(t.dataset.a==='q'){UI.q=t.value;document.getElementById('rgrid').innerHTML=bookGrid()}
  if(t.dataset.c){UI.cal[t.dataset.c]=t.value;}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.p){const k=t.dataset.p;let val=k==='goal'?t.value:Number(t.value);
    const lim={age:[14,90],height:[130,230],weight:[35,300],activity:[1.2,1.9]};
    if(lim[k]){if(!isFinite(val)||val<lim[k][0]||val>lim[k][1]){toast('Проверь значение');t.value=S.profile[k];return}}
    S.profile[k]=val;save();if(S.onboarded)render();else renderOb()}
  if(t.dataset.c&&UI.cal){UI.cal[t.dataset.c]=t.value;renderLayer()}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.f;
  if(f==='newpw'){(async()=>{
    const login=document.getElementById('n_login').value.trim(),pw=document.getElementById('n_pw').value;
    const fail=m=>{AUTH.err=m;render();document.getElementById('n_login').value=login};
    if(login.length<3)return fail('Логин — минимум 3 символа.');
    if(pw.length<6)return fail('Пароль — минимум 6 символов.');
    if(pw!==document.getElementById('n_pw2').value)return fail('Пароли не совпадают.');
    const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
    S.auth={login,salt,hash:await hashPw(pw,salt)};save();setLogged(true);AUTH={mode:null,err:'',busy:false,reset:false};render();toast('Пароль изменён, данные на месте');
  })();return}
  if(f==='reg'||f==='login'){(async()=>{
    const login=document.getElementById('a_login').value.trim(),pw=document.getElementById('a_pw').value;
    const fail=m=>{AUTH.err=m;AUTH.busy=false;const keep=login;render();const l=document.getElementById('a_login');if(l)l.value=keep};
    if(!crypto||!crypto.subtle)return fail('Этот браузер не поддерживает вход. Открой ссылку в Safari.');
    if(f==='reg'){
      if(S.auth)return fail('На этом телефоне уже есть аккаунт «'+S.auth.login+'». Открой «Вход».');
      if(login.length<3)return fail('Логин — минимум 3 символа.');
      if(pw.length<6)return fail('Пароль — минимум 6 символов.');
      if(pw!==document.getElementById('a_pw2').value)return fail('Пароли не совпадают.');
      AUTH.busy=true;const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
      S.auth={login,salt,hash:await hashPw(pw,salt)};save();setLogged(true);AUTH={mode:null,err:'',busy:false,reset:false};render();toast('Аккаунт создан');
    }else{
      if(!S.auth){AUTH.reset=true;return fail('Аккаунт не найден в этом месте. Смотри подсказку ниже.')}
      AUTH.busy=true;const h=await hashPw(pw,S.auth.salt);
      if(login.toLowerCase()!==S.auth.login.toLowerCase())return fail('Логин не совпадает. На этом телефоне зарегистрирован логин «'+S.auth.login+'».');
      if(h!==S.auth.hash){const h2=pw.trim()!==pw?await hashPw(pw.trim(),S.auth.salt):'';if(h2!==S.auth.hash)return fail('Неверный пароль. Нажми «Показать пароль» и проверь раскладку (русская/английская) и заглавные буквы.')}
      setLogged(true);AUTH={mode:null,err:'',busy:false,reset:false};render()}
  })();return}
  if(f==='extra'){const el=document.getElementById('extra');const v=el.value.trim();if(!v)return;S.shop.extra.push({t:v,done:false});save();render();document.getElementById('extra').focus()}
  if(f==='weight'){const w=Number(String(document.getElementById('w').value).replace(',','.'));if(!(w>30&&w<300)){toast('Введи вес в кг');return}
    S.weights=S.weights.filter(x=>x.d!==today());S.weights.push({d:today(),w});S.profile.weight=w;save();render();toast('Записано: '+fmtNum(w)+' кг')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(sheet||UI.cal)){sheet=null;UI.cal=null;renderLayer()}});
setInterval(()=>{if(S.onboarded&&!cook&&!S.plan[today()]){render()}},60000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
</script>
</body>
